name: "G13: Release"

on:
  push:
    tags:
      - 'g13-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: g13

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ubuntu test script (release gate)
        run: ./scripts/test_ubuntu.sh --system-deps

  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libhidapi-hidraw0 libusb-1.0-0-dev wget

      - name: Install PIL for icon generation
        run: pip install Pillow

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: g13-appimage
          path: g13/dist/*.AppImage

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [test, build-appimage]
    environment:
      name: pypi
      url: https://pypi.org/p/g13-linux
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/g13-v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Publish to PyPI
        id: publish_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: g13/dist/

      - name: Download AppImage artifact
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: g13-appimage
          path: g13/dist/

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: g13-v${{ steps.get_version.outputs.VERSION }}
          files: |
            g13/dist/*.whl
            g13/dist/*.tar.gz
            g13/dist/*.AppImage
          body: |
            ## g13-linux v${{ steps.get_version.outputs.VERSION }}

            Linux userspace driver for the Logitech G13 Gaming Keyboard.

            ### Installation

            **From PyPI:**
            ```bash
            pip install g13-linux
            ```

            **From wheel:**
            ```bash
            pip install g13_linux-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl
            ```

            **AppImage:**
            ```bash
            chmod +x G13_Linux-${{ steps.get_version.outputs.VERSION }}-x86_64.AppImage
            ./G13_Linux-${{ steps.get_version.outputs.VERSION }}-x86_64.AppImage
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report PyPI publish status
        if: steps.publish_pypi.outcome != 'success'
        run: |
          echo "::warning::PyPI publish was skipped or failed. Check trusted publisher configuration for this workflow path:"
          echo "::warning::.github/workflows/g13-release.yml"
